name: Build and Deploy Jekyll site

on:
  push:
    branches:
      - main  # cambia a 'master' si tu branch principal se llama master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - uses: actions/checkout@v3

      # 2️⃣ Configurar Ruby
      - uses: actions/setup-ruby@v1
        with:
          ruby-version: 3.1

      # 3️⃣ Instalar Bundler
      - run: gem install bundler

      # 4️⃣ Instalar solo la gema github-pages compatible
      - run: bundle install --jobs 4 --retry 3

      # 5️⃣ Construir el sitio usando la gema github-pages
      - run: bundle exec jekyll build

      # 6️⃣ Publicar en GitHub Pages
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
